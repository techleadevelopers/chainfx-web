<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Blockchain Background Layer</title>

<style>
/* CSS BACKGROUND START */
#blockchain-bg {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: -1;
  overflow: hidden;
  background: transparent;
  /* very faint light wash so it blends on white pages */
  background-image:
    radial-gradient(120% 90% at 15% 0%, rgba(6, 182, 212, 0.06) 0%, rgba(255, 255, 255, 0) 60%),
    radial-gradient(100% 80% at 90% 100%, rgba(17, 80, 168, 0.05) 0%, rgba(255, 255, 255, 0) 60%);
}

/* faint data grid */
#blockchain-bg .bcbg-grid {
  position: absolute;
  inset: -2px;
  background-image:
    linear-gradient(to right, rgba(23, 103, 183, 0.055) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(23, 103, 183, 0.055) 1px, transparent 1px);
  background-size: 64px 64px;
  mask-image: radial-gradient(120% 100% at 50% 40%, #000 35%, transparent 85%);
  -webkit-mask-image: radial-gradient(120% 100% at 50% 40%, #000 35%, transparent 85%);
  animation: bcbg-grid-drift 38s linear infinite;
}
@keyframes bcbg-grid-drift {
  from { transform: translate3d(0, 0, 0); }
  to   { transform: translate3d(-64px, -64px, 0); }
}

#blockchain-bg canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

@media (prefers-reduced-motion: reduce) {
  #blockchain-bg .bcbg-grid { animation: none; }
}
/* CSS BACKGROUND END */

/* --- demo page only: delete when copying --- */
/* NOTE: the background sits at z-index:-1, so the <body> must stay transparent.
   Put the page background on <html> (or on your own content wrapper). */
html { height: 100%; background: #ffffff; }
body { height: 100%; margin: 0; background: transparent; }
</style>
</head>
<body>

<!-- HTML BACKGROUND START -->
<div id="blockchain-bg" aria-hidden="true">
  <div class="bcbg-grid"></div>
  <canvas id="bcbg-canvas"></canvas>
</div>
<!-- HTML BACKGROUND END -->

<script>
// JS BACKGROUND START
(function () {
  var root = document.getElementById('blockchain-bg');
  if (!root) return;
  var canvas = document.getElementById('bcbg-canvas');
  var ctx = canvas.getContext('2d');

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

  var C = {
    deep:  [17, 80, 168],   // #1150a8
    cyan:  [6, 182, 212],   // #06b6d4
    teal:  [16, 174, 200],  // #10aec8
    blue:  [23, 103, 183]   // #1767b7
  };
  function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }

  var W = 0, H = 0, dpr = 1;
  var nodes = [], links = [], packets = [], arcs = [];
  var raf = null, t0 = performance.now();

  function rand(a, b) { return a + Math.random() * (b - a); }

  function build() {
    var area = W * H;
    var count = Math.max(28, Math.min(110, Math.round(area / 20000)));
    nodes = [];
    for (var i = 0; i < count; i++) {
      nodes.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: rand(-0.09, 0.09),
        vy: rand(-0.09, 0.09),
        r: rand(0.8, 2.1),
        phase: Math.random() * Math.PI * 2,
        speed: rand(0.4, 1.4),
        c: [C.cyan, C.teal, C.blue, C.deep][(Math.random() * 4) | 0]
      });
    }

    // faint arcs
    arcs = [];
    var arcCount = 4;
    for (var a = 0; a < arcCount; a++) {
      arcs.push({
        x: rand(0, W), y: rand(0, H),
        r: rand(Math.min(W, H) * 0.16, Math.min(W, H) * 0.42),
        start: Math.random() * Math.PI * 2,
        len: rand(0.5, 1.5),
        spin: rand(-0.05, 0.05),
        phase: Math.random() * Math.PI * 2
      });
    }
    packets = [];
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = root.clientWidth || window.innerWidth;
    H = root.clientHeight || window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    build();
    if (reduceMotion.matches) drawStatic();
  }

  var MAX_DIST = 140;

  function computeLinks() {
    links = [];
    for (var i = 0; i < nodes.length; i++) {
      for (var j = i + 1; j < nodes.length; j++) {
        var dx = nodes[i].x - nodes[j].x, dy = nodes[i].y - nodes[j].y;
        var d2 = dx * dx + dy * dy;
        if (d2 < MAX_DIST * MAX_DIST) {
          links.push({ a: i, b: j, d: Math.sqrt(d2) });
        }
      }
    }
  }

  function spawnPacket() {
    if (!links.length || packets.length > 22) return;
    var l = links[(Math.random() * links.length) | 0];
    packets.push({ a: l.a, b: l.b, p: 0, sp: rand(0.004, 0.011), c: Math.random() < 0.5 ? C.cyan : C.blue });
  }

  function drawScene(time) {
    var t = time / 1000;
    ctx.clearRect(0, 0, W, H);

    // faint arcs
    ctx.lineWidth = 1;
    for (var k = 0; k < arcs.length; k++) {
      var ar = arcs[k];
      var s = ar.start + ar.spin * t;
      var alpha = 0.05 + 0.035 * (0.5 + 0.5 * Math.sin(t * 0.5 + ar.phase));
      ctx.strokeStyle = rgba(C.teal, alpha);
      ctx.beginPath();
      ctx.arc(ar.x, ar.y, ar.r, s, s + ar.len);
      ctx.stroke();
    }

    // thin shimmering links
    for (var i = 0; i < links.length; i++) {
      var l = links[i];
      var na = nodes[l.a], nb = nodes[l.b];
      var dx = na.x - nb.x, dy = na.y - nb.y;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d > MAX_DIST) continue;
      var fade = 1 - d / MAX_DIST;
      var shimmer = 0.55 + 0.45 * Math.sin(t * 1.1 + (l.a + l.b) * 0.7);
      ctx.strokeStyle = rgba(C.blue, 0.16 * fade * shimmer);
      ctx.lineWidth = 0.7;
      ctx.beginPath();
      ctx.moveTo(na.x, na.y);
      ctx.lineTo(nb.x, nb.y);
      ctx.stroke();
    }

    // travelling transaction dots
    for (var p = packets.length - 1; p >= 0; p--) {
      var pk = packets[p];
      pk.p += pk.sp;
      if (pk.p >= 1) { packets.splice(p, 1); continue; }
      var A = nodes[pk.a], B = nodes[pk.b];
      if (!A || !B) { packets.splice(p, 1); continue; }
      var x = A.x + (B.x - A.x) * pk.p;
      var y = A.y + (B.y - A.y) * pk.p;
      ctx.fillStyle = rgba(pk.c, 0.85);
      ctx.beginPath(); ctx.arc(x, y, 2.2, 0, Math.PI * 2); ctx.fill();
    }

    // pulsing nodes
    for (var n = 0; n < nodes.length; n++) {
      var nd = nodes[n];
      var pulse = 0.5 + 0.5 * Math.sin(t * nd.speed + nd.phase);
      var r = nd.r * (0.85 + 0.4 * pulse);
      ctx.fillStyle = rgba(nd.c, 0.35 + 0.35 * pulse);
      ctx.beginPath(); ctx.arc(nd.x, nd.y, r, 0, Math.PI * 2); ctx.fill();
    }

  }

  function step(time) {
    var dt = Math.min(32, time - t0) / 16.67;
    t0 = time;

    for (var i = 0; i < nodes.length; i++) {
      var nd = nodes[i];
      nd.x += nd.vx * dt;
      nd.y += nd.vy * dt;
      if (nd.x < -20) nd.x = W + 20; else if (nd.x > W + 20) nd.x = -20;
      if (nd.y < -20) nd.y = H + 20; else if (nd.y > H + 20) nd.y = -20;
    }
    computeLinks();
    if (Math.random() < 0.06) spawnPacket();
    drawScene(time);
    raf = requestAnimationFrame(step);
  }

  function drawStatic() {
    computeLinks();
    drawScene(0);
  }

  function start() {
    stop();
    if (reduceMotion.matches) { drawStatic(); return; }
    t0 = performance.now();
    raf = requestAnimationFrame(step);
  }
  function stop() { if (raf) cancelAnimationFrame(raf); raf = null; }

  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 150);
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stop(); else start();
  });

  if (reduceMotion.addEventListener) reduceMotion.addEventListener('change', start);

  resize();
  start();
})();
// JS BACKGROUND END
</script>
</body>
</html>
